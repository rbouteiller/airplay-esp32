<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>MQTT</title>
<style>body{font-family:sans-serif;max-width:420px;margin:20px auto;padding:0 12px}label{display:block;margin:10px 0 4px}input[type=text],input[type=password],input[type=number]{width:100%;padding:6px;box-sizing:border-box}button{margin-top:14px;padding:8px 16px}</style>
</head><body><h2>MQTT now-playing</h2><label><input type=checkbox id=enabled> Enabled</label><label>Broker host</label><input type=text id=host><label>Port</label><input type=number id=port><label>Username</label><input type=text id=username><label>Password <small id=pw></small></label><input type=password id=password placeholder='(unchanged)'><label>Base topic</label><input type=text id=base_topic><label>Discovery prefix</label><input type=text id=discovery_prefix><label><input type=checkbox id=artwork> Receive cover art (restart needed)</label><button onclick='save()'>Save</button> <span id=msg></span><p><a href='/api/nowplaying'>/api/nowplaying</a> &middot; <a href='/'>Back</a></p>
<script>
const F=['host','port','username','base_topic','discovery_prefix'];fetch('/api/mqtt').then(r=>r.json()).then(c=>{F.forEach(k=>document.getElementById(k).value=c[k]);enabled.checked=c.enabled;artwork.checked=c.artwork;pw.textContent=c.has_password?'(set)':'(none)';msg.textContent=c.connected?'connected':'not connected'});function save(){const b={enabled:enabled.checked,artwork:artwork.checked};F.forEach(k=>b[k]=document.getElementById(k).value);b.port=+b.port;if(password.value)b.password=password.value;fetch('/api/mqtt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()).then(r=>{msg.textContent=r.success?'saved':'error: '+r.error;password.value=''})}
</script>
</body></html>
