[platformio]
default_envs = esp32s3
src_dir = main
extra_configs = user_platformio.ini

; Common settings for all environments
[env]
; The official platformio/espressif32 platform is stuck on ESP-IDF 5.5.3 and has
; no ESP32-C5 support. The pioarduino fork ships 5.5.5 -- the version CI pins and
; the minimum Sendspin's WebSocket post-handshake callback needs -- along with
; the only toolchain build 5.5.5 accepts.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
monitor_speed = 115200
monitor_filters = direct
board_build.filesystem = spiffs
; PlatformIO packs data/ itself for uploadfs, so it needs the same gzip step
; the CMake build applies. See scripts/gen_spiffs_image.py.
extra_scripts = pre:scripts/pio_stage_spiffs.py
build_flags =
    -Wno-maybe-uninitialized
    -Os
    -DCONFIG_SPIRAM_SIZE=8388608

[env:squeezeamp]
framework = espidf
board = esp-wrover-kit
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = components/boards/partitions.csv
board_upload.flash_size = 8MB
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.squeezeamp"
monitor_rts=0
monitor_dtr=0

[env:squeezeamp-bt]
extends = env:squeezeamp
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.squeezeamp;config/sdkconfig.defaults.bt"
    
[env:squeezeamp-4m]
extends = env:squeezeamp
board_build.flash_size = 4MB
board_build.partitions = components/boards/partitions-4m.csv
board_upload.flash_size = 4MB
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.squeezeamp-4m"

[env:esp32s3]
framework = espidf
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = components/boards/partitions.csv
board_upload.flash_size = 16MB
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3"

[env:esp32s3-uac]
extends = env:esp32s3
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.defaults.uac"

[env:esp32s3-jtag]
extends = env:esp32s3
upload_protocol = esp-builtin

; Seeed XIAO ESP32-C5 (RISC-V single-core, 8MB flash, 8MB PSRAM, WiFi 6).
; NOTE: ESP32-C5 support (and the seeed_xiao_esp32c5 board) comes from the
; pioarduino platform pinned in [env]. Alternatively, use the ESP-IDF native
; flow:
;   idf.py set-target esp32c5
;   idf.py -DSDKCONFIG_DEFAULTS="config/sdkconfig.defaults;config/sdkconfig.defaults.esp32c5" build flash monitor
[env:esp32c5-xiao]
framework = espidf
board = seeed_xiao_esp32c5
board_build.mcu = esp32c5
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = components/boards/partitions.csv
board_upload.flash_size = 8MB
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.esp32c5"

monitor_rts=0
monitor_dtr=0

