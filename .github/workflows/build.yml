name: Build

# Reusable firmware build, called by ci.yml (pull requests / main), release.yml
# (tags) and beta.yml (staging).
#
# The target list itself lives in targets.json next to this file, because a
# matrix has to be JSON before fromJSON() can filter it. That file is the single
# source of truth: every entry in it gets a published binary, and every entry
# needs a matching docs/firmware/<name>.json manifest or the browser installer
# has nothing to point at.
#
# Entries flagged "core": true also build on a pull request. The rest build only
# on staging and on a release tag, which stops the per-PR check growing a job
# for every board variant while still publishing all of them.
on:
  workflow_call:
    inputs:
      scope:
        description: >
          "release" builds every target in targets.json. "core" builds only the
          entries flagged core, which between them cover each board support
          directory and each chip at least once.
        type: string
        default: release
        required: false

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/workflows/targets.json
          sparse-checkout-cone-mode: false

      - name: Select the ${{ inputs.scope }} target list
        id: select
        run: |
          set -euo pipefail
          if [ "${{ inputs.scope }}" = "core" ]; then
            filter='[.[] | select(.core)]'
          else
            filter='.'
          fi
          include="$(jq -c "$filter" .github/workflows/targets.json)"
          echo "$include" | jq -r '.[].name' | sed 's/^/building /'
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      # One board failing to build must not cancel the others. Without this a
      # single broken target takes the whole staging matrix down with it and no
      # beta gets published for any board.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.include) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Build ${{ matrix.name }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: ${{ matrix.target }}
          command: >
            idf.py -DSDKCONFIG_DEFAULTS="${{ matrix.sdkconfig }}" build &&
            cd build &&
            esptool.py --chip ${{ matrix.target }} merge_bin --format raw -o merged-firmware.bin $(cat flash_args) &&
            cp merged-firmware.bin ../airplay2-receiver-${{ matrix.name }}.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.name }}
          path: airplay2-receiver-${{ matrix.name }}.bin
