name: Build

# Reusable firmware build, called by ci.yml (pull requests / main), release.yml
# (tags) and beta.yml (staging).
#
# The target list itself lives in targets.json next to this file, because a
# matrix has to be JSON before fromJSON() can filter it. That file is the single
# source of truth: every entry in it gets a published binary, and every entry
# needs a matching docs/firmware/<name>.json manifest or the browser installer
# has nothing to point at.
#
# Each entry's name is also the name of its configure preset in
# CMakePresets.json, which holds the chip and the layered sdkconfig defaults. The targets job reads the chip from
# there, so a board's configuration is stated once. Every idf.py call has to
# name its preset: with CMakePresets.json present, idf.py otherwise picks the
# first one in the file, whatever -D options and target it is given.
#
# Entries flagged "core": true also build on a pull request. The rest build only
# on staging and on a release tag, which stops the per-PR check growing a job
# for every board variant while still publishing all of them.
on:
  workflow_call:
    inputs:
      scope:
        description: >
          "release" builds every target in targets.json. "core" builds only the
          entries flagged core, which between them cover each board support
          directory and each chip at least once.
        type: string
        default: release
        required: false
      beta:
        description: >
          Tag the built firmware's PROJECT_VER (and so the web UI/mDNS "fv")
          with "-beta", identifying it as a beta.yml build rather than a release
          or a plain CI/dev build.
        type: boolean
        default: false
        required: false

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/workflows/targets.json
            /CMakePresets.json
          sparse-checkout-cone-mode: false

      - name: Select the ${{ inputs.scope }} target list
        id: select
        run: |
          set -euo pipefail
          targets=.github/workflows/targets.json
          missing="$(jq -r --slurpfile p CMakePresets.json \
            '[$p[0].configurePresets[].name] as $names
             | .[] | select(.name as $x | $names | index($x) | not)
             | .name' "$targets")"
          if [ -n "$missing" ]; then
            echo "$missing" | sed 's/^/::error::no such preset in CMakePresets.json: /'
            exit 1
          fi
          if [ "${{ inputs.scope }}" = "core" ]; then
            filter='[.[] | select(.core)]'
          else
            filter='.'
          fi
          # Add each entry's chip, read from its preset.
          include="$(jq -c --slurpfile p CMakePresets.json \
            "$filter | map(. as \$t | \$t + {target: (\$p[0].configurePresets[]
              | select(.name == \$t.name) | .cacheVariables.IDF_TARGET)})" \
            "$targets")"
          echo "$include" | jq -r '.[].name' | sed 's/^/building /'
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      # One board failing to build must not cancel the others. Without this a
      # single broken target takes the whole staging matrix down with it and no
      # beta gets published for any board.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.include) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Build ${{ matrix.name }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: ${{ matrix.target }}
          command: >
            idf.py --preset ${{ matrix.name }}
            -DFIRMWARE_BETA=${{ inputs.beta && 'ON' || 'OFF' }} build &&
            cd build/${{ matrix.name }} &&
            esptool --chip ${{ matrix.target }} merge-bin --format raw -o merged-firmware.bin $(cat flash_args) &&
            cp merged-firmware.bin ../../airplay2-receiver-${{ matrix.name }}.bin &&
            cp airplay2-receiver.bin ../../ota-firmware-${{ matrix.name }}.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.name }}
          path: airplay2-receiver-${{ matrix.name }}.bin
          if-no-files-found: error

      - name: Upload OTA firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: ota-firmware-${{ matrix.name }}
          path: ota-firmware-${{ matrix.name }}.bin
          if-no-files-found: error
