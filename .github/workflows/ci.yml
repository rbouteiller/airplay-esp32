name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  # Deliberately unfiltered, unlike push above. ci-gate is a required check, and
  # a required check whose workflow never triggers sits "Expected" forever and
  # blocks the merge. The workflow therefore always starts on a pull request and
  # decides for itself whether there is any firmware work to do.
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  # Mirrors the paths-ignore above: a pull request touching only Markdown needs
  # no ESP-IDF toolchain, which would otherwise cost several minutes per docs
  # typo now that the documentation site lives in this repo.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
              --jq '.[].filename')"
          fi
          # Anything we cannot enumerate (push, manual run) counts as code, so
          # the default on an unknown event is to run everything.
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qv '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Markdown-only change, skipping the firmware jobs."
          fi

  format-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Install clang-format
        run: |
          python3 -m pip install --user -r requirements-dev.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: scripts/format.sh --check

      - name: Test PCM512x failure handling
        run: python3 tests/pcm51xx/run.py

      - name: Install Node.js for EQ page regression tests
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test the rate a TAS5805M's filters are designed at
        run: python3 tests/tas5805m_rate/run.py

      - name: Test the PTP offset filter
        run: python3 tests/ptp_clock/run.py

      - name: Test software EQ against a reference
        run: python3 tests/audio_eq/run.py

      - name: Test the per-output delay
        run: python3 tests/audio_delay/run.py

      - name: Test the realtime stream's resend requests
        run: python3 tests/rtp_resend/run.py

      - name: Test AirPlay device names in binary plists
        run: python3 tests/bplist/run.py

      - name: Test the USB-PD trigger against a simulated charger
        run: python3 tests/husb238a/run.py

      - name: Test the drift servo's trims on a tone
        run: python3 tests/audio_scheduler/run.py

      - name: Test how far a TAS58xx filter chain lifts full scale
        run: python3 tests/tas58xx_peak/run.py

      - name: Test every TAS58xx filter shape, as designed and as packed
        run: python3 tests/tas58xx_bq/run.py

      - name: Test the EQ page draws the filters the firmware designs
        run: python3 tests/bq_page/run.py

  lint-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      # Needs ESP-IDF's clang toolchain; see scripts/lint.sh.
      - name: Run clang-tidy
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          command: scripts/lint.sh

  # The release matrix in build.yml only covers I2S/DAC boards, so a backend
  # that misses part of the audio_output API links fine there and breaks only
  # for whoever selects it. These configurations ship no firmware artifact;
  # they exist to keep every backend linking.
  output-backends:
    needs: [format-check, lint-check]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: spdif
            target: esp32s3
            sdkconfig: "config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.defaults.spdif"
          - name: usb
            target: esp32s3
            sdkconfig: "config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.defaults.usb"
          # Not an output backend, but no release board turns it on either.
          - name: software-eq
            target: esp32s3
            sdkconfig: "config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.defaults.uac;config/sdkconfig.defaults.software-eq"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Build ${{ matrix.name }} output backend
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: ${{ matrix.target }}
          command: idf.py -DSDKCONFIG_DEFAULTS="${{ matrix.sdkconfig }}" build

  # A pull request builds the "core" subset of the target list: enough to cover
  # every board support directory and every chip, without a job per board
  # variant. A push to main builds the full release matrix.
  build:
    needs: [format-check, lint-check]
    uses: ./.github/workflows/build.yml
    with:
      scope: ${{ github.event_name == 'pull_request' && 'core' || 'release' }}

  # The one required status check for this workflow. Branch protection cannot
  # depend on the jobs above directly: they are skipped on a docs-only pull
  # request, and the individual job names would also have to be re-listed in the
  # ruleset every time the matrix changes. This runs unconditionally and turns
  # the whole workflow into a single pass/fail, treating skipped as fine.
  ci-gate:
    if: always()
    needs: [changes, format-check, lint-check, output-backends, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream results
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $results"
          for result in $results; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A job this gate depends on reported '$result'"
                exit 1
                ;;
            esac
          done
          echo "All good."
